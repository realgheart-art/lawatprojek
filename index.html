<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Laporan Lawatan Tapak</title>
<meta name="theme-color" content="#1D1E1C">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<style>
/* Laporan Lawatan Tapak — JPN Kedah (S4PD)
   Satu lajur untuk kerja lapangan: PIN → senarai projek → borang berpapan tanda, satu kad setiap Perkara, bar tindakan di ibu jari. */
:root{
  --bg:#F1F0EE; --surface:#FFFFFF; --sunk:#E7E5E1; --ink:#1D1E1C; --muted:#67655F; --line:#D8D5CF;
  --accent:#D9531B; --accent-ink:#A93D0E; --accent-soft:#FBE7DC;
  --board:#1D1E1C; --board-ink:#F6F4F0;
  --ok:#2E7A4C; --ok-soft:#DFF0E5; --bad:#B3262E; --bad-soft:#F8DEDF; --na:#7A7872; --na-soft:#E9E7E3;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#151614; --surface:#1F201E; --sunk:#2A2B28; --ink:#ECEAE5; --muted:#A29F98; --line:#363733;
  --accent:#FF7A3C; --accent-ink:#FF9A68; --accent-soft:#3B2418; --board:#0C0D0C; --board-ink:#F6F4F0;
  --ok:#5CC287; --ok-soft:#1C3326; --bad:#F06A70; --bad-soft:#3A1E20; --na:#A29F98; --na-soft:#2C2D2A; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16.5px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 130px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}

/* login */
.login{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:18px}
.login .board{width:100%;max-width:380px;margin:0}
.login .board h1{font-size:2.1rem;text-transform:uppercase;color:var(--board-ink)}
.login form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px}
.dots{display:flex;justify-content:center;gap:16px;padding:6px 0}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);display:block}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:62px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-family:var(--display);font-size:1.8rem;font-weight:600}
.pad button:active{background:var(--sunk)}
.pad .fn{font-family:var(--body);font-size:.95rem;font-weight:700;color:var(--muted)}
.err{color:var(--bad);font-weight:600;text-align:center;min-height:1.5em;font-size:.92rem}
.foot{font-size:.78rem;color:var(--muted);text-align:center}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.top h1{font-size:1.7rem;text-transform:uppercase}
.sub{font-size:.78rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.grow{flex:1;min-width:0}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);flex-shrink:0;color:var(--ink);text-decoration:none}
.iconbtn svg{width:20px;height:20px}
.sync{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.sync .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex-shrink:0}
.sync.wait .dot{background:var(--accent)} .sync.off .dot{background:var(--bad)}
.sync .who{margin-left:auto}
.linkbtn{background:none;border:0;padding:0;color:var(--accent-ink);font-weight:700;text-decoration:underline;text-underline-offset:2px}

/* tally & filter */
.tally{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.tally button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 8px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.tally b{font-family:var(--display);font-size:1.95rem;line-height:1;font-variant-numeric:tabular-nums}
.tally span{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tally button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tally .t-selesai b{color:var(--ok)} .tally .t-draf b{color:var(--accent-ink)}
.filters{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.filters input,.filters select{height:48px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0 12px;min-width:0}
.filters input{flex:1 1 220px} .filters select{flex:0 1 190px}

/* list */
.list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.proj{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:start;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;color:inherit;text-decoration:none}
.proj:hover{border-color:var(--muted)}
.proj .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--muted);min-width:0}
.chip{font-family:var(--mono);font-size:.78rem;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--sunk);color:var(--ink)}
.proj .nm{font-family:var(--display);font-weight:600;font-size:1.28rem;line-height:1.15;text-transform:uppercase;grid-column:1;min-width:0}
.proj .jenis{font-size:.84rem;color:var(--muted);grid-column:1}
.pill{font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:999px;white-space:nowrap;grid-column:2;grid-row:1}
.pill.belum{background:var(--na-soft);color:var(--na)} .pill.draf{background:var(--accent-soft);color:var(--accent-ink)} .pill.selesai{background:var(--ok-soft);color:var(--ok)}
.bar{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:.78rem;color:var(--muted)}
.bar i{flex:1;height:5px;border-radius:3px;background:var(--sunk);overflow:hidden;display:block}
.bar i::after{content:"";display:block;height:100%;width:var(--w,0%);background:var(--accent)}
.bar .act{color:var(--bad);font-weight:700}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.banner{margin-top:12px;font-size:.88rem;padding:12px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink)}

/* signboard */
.board{margin-top:14px;background:var(--board);color:var(--board-ink);border-radius:var(--r);overflow:hidden}
.board .in{padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#F3A07A}
.board h2{font-size:1.5rem;text-transform:uppercase;font-weight:600;line-height:1.15}
.board dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:4px 0 0;font-size:.92rem}
.board dt{color:#B7B3AB;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.board dd{margin:0;font-weight:600;min-width:0}
.hazard{height:8px;background:repeating-linear-gradient(-45deg,#E8641F 0 12px,#1D1E1C 12px 24px)}

/* form */
.visit{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.75rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;min-height:48px;width:100%}
.upd{font-size:.82rem;color:var(--muted);margin-top:8px}
.group{margin-top:24px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.group h3{font-size:1.3rem;text-transform:uppercase}
.group span{font-size:.84rem;color:var(--muted)}
.cards{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.card[data-st="tindakan"]{border-left:5px solid var(--bad)} .card[data-st="ok"]{border-left:5px solid var(--ok)} .card[data-st="tb"]{border-left:5px solid var(--na)}
.card .hd{display:flex;gap:10px;align-items:flex-start}
.num{font-family:var(--display);font-weight:700;font-size:1.12rem;min-width:36px;height:36px;border-radius:8px;background:var(--sunk);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.card h4{margin:0;font-size:1.05rem;font-weight:700;line-height:1.3}
.hint{font-size:.84rem;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:11px 4px;font-size:.84rem;font-weight:600;color:var(--muted);border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"][data-v="ok"]{background:var(--ok-soft);color:var(--ok)}
.seg button[aria-pressed="true"][data-v="tindakan"]{background:var(--bad-soft);color:var(--bad)}
.seg button[aria-pressed="true"][data-v="tb"]{background:var(--na-soft);color:var(--ink)}
textarea{resize:vertical;min-height:88px;line-height:1.45}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--sunk);border:0;padding:0;max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .q{position:absolute;left:4px;bottom:4px;font-size:.66rem;font-weight:700;background:rgba(0,0,0,.65);color:#fff;padding:2px 6px;border-radius:4px;letter-spacing:.03em}
.ph.busy::after{content:"";position:absolute;inset:0;margin:auto;width:24px;height:24px;border:3px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.shoot{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shoot label{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:8px;font-weight:700;font-size:.95rem;cursor:pointer;user-select:none;position:relative}
.shoot .cam{background:var(--accent);color:#fff}
.shoot .gal{border:1px solid var(--line);background:var(--surface)}
.shoot svg{width:20px;height:20px}
.shoot input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.shoot label:focus-within{outline:3px solid var(--accent);outline-offset:2px}

/* action bar */
.actions{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.actions .in{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.save{font-size:.82rem;color:var(--muted);flex:1 1 120px;min-width:0}
.save b{color:var(--ink)}
.btn{height:46px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.9rem;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.done{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.wa{background:#1F8F4E;color:#fff;border-color:#1F8F4E}
.btn:disabled{opacity:.55;cursor:default}
.btn svg{width:18px;height:18px}

/* overlays */
.ov{position:fixed;inset:0;z-index:40;background:rgba(10,10,9,.92);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.ov .img{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
.ov img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.ov img.loading{filter:blur(6px);opacity:.7}
.ov .bt{display:flex;gap:8px;justify-content:space-between;padding-top:12px;flex-wrap:wrap}
.ov .btn{background:#2A2B28;color:#F6F4F0;border-color:#44453F}
.ov .btn.danger{background:#B3262E;border-color:#B3262E}
.ov .cap{color:#C8C4BC;font-size:.84rem;align-self:center}
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,10,9,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:14px 14px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;max-height:90dvh;overflow:auto}
.sheet h3{font-size:1.45rem;text-transform:uppercase}
.sheet .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;font-weight:600;max-width:calc(100% - 32px);text-align:center}

/* format toggle, tabs, Borang A controls */
.ftog{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:14px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.ftog button{border:0;background:transparent;padding:11px 8px;font-weight:700;font-size:.9rem;color:var(--muted);border-left:1px solid var(--line);line-height:1.2}
.ftog button:first-child{border-left:0}
.ftog button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ftog small{display:block;font-weight:600;font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;opacity:.75}
.tabs{display:grid;grid-template-columns:1fr 1fr;margin-top:12px;border-bottom:2px solid var(--line)}
.tabs a{padding:12px 6px 10px;text-align:center;font-weight:700;font-size:.92rem;color:var(--muted);text-decoration:none;border-bottom:3px solid transparent;margin-bottom:-2px;line-height:1.25}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .mono{display:block;font-size:.74rem;font-weight:600;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-weight:600;font-size:.88rem;color:var(--ink);min-height:42px}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opts[data-set="m"] .opt[aria-pressed="true"]::before{content:"✓ "}
.sublbl{font-size:.75rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:-4px}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.nums input{font-family:var(--mono);font-size:1.05rem}
.card[data-st="isi"]{border-left:5px solid var(--ok)}
.card .nota{font-size:.82rem;color:var(--accent-ink);font-weight:600}
@media (max-width:420px){.visit{grid-template-columns:1fr}.tally b{font-size:1.6rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

<script>
/* ======================= KONFIGURASI ======================= */
const API_URL = "https://script.google.com/macros/s/AKfycbwWFKiTZNxg8mwqAklMCfiiOuvAND70vbJWY07hv2fanjwEZu3Gf-5Kh8ZEeL54h4A/exec"; // ← Tampal URL Web App (/exec) daripada Code.gs di sini
const APP_VER = "1.1.1";

/* ======================= DATA BORANG ======================= */
const PPD_KEDAH=["Baling","Bandar Baharu","Kota Setar","Kuala Muda","Kubang Pasu","Kulim","Langkawi","Padang Terap","Pendang","Pokok Sena","Sik","Yan"];

/* Format 1: Laporan Lawatan Tapak Projek */
const PERKARA=[
 {k:"laluan_masuk",t:"Laluan Masuk Tapak Projek",n:"1"},
 {k:"laluan_bomba",t:"Laluan Bomba",n:"2"},
 {k:"struktur",t:"Perubahan Struktur",h:"Pencawang, dll",n:"3"},
 {k:"tnb",t:"Utiliti – Elektrik",h:"TNB",n:"4"},
 {k:"sada",t:"Utiliti – Air",h:"SADA",n:"5"},
 {k:"iwk",t:"Utiliti – Kumbahan",h:"IWK",n:"6"},
 {k:"pili_bomba",t:"Pili Bomba",n:"7"},
 {k:"discharge",t:"Discharge Area",n:"8"},
 {k:"perobohan",t:"Keperluan Perobohan",h:"Pondok pengawal, laluan berbumbung, signage, dll",n:"9"},
 {k:"sur_bd",t:"Bilik Darjah Sementara",g:1,n:"10a"},
 {k:"sur_tandas",t:"Tandas Sementara",g:1,n:"10b"},
 {k:"sur_makan",t:"Ruang Makan Sementara",g:1,n:"10c"},
 {k:"sur_lain",t:"Lain-lain",h:"Nyatakan",g:1,n:"10d",other:1},
];
const STATUS={ok:"Tiada isu",tindakan:"Perlu tindakan",tb:"Tidak berkaitan"};

/* Format 2: Borang A – RMKe13 RP1 / BPN3 (Maklumat Am Sekolah)
   opts = pilihan (satu jawapan, atau banyak jika multi); x = pilihan eksklusif; sub = senarai semak tambahan; nums = medan bilangan */
const YT=["Ya","Tidak"], AT=["Ada","Tiada"];
const SOALAN=[
 {k:"a_cop",n:"Cop",t:"Cop Sekolah",h:"Ambil gambar cop sekolah yang telah dicop pada borang atau kertas",hdr:1},
 {k:"a_banjir",n:"1",t:"Sejarah Kawasan Banjir",opts:YT},
 {k:"a_tekanan_air",n:"2",t:"Status Tekanan Air",opts:["Kerap terputus","Tekanan kuat","Tekanan sederhana","Tekanan rendah"],multi:1},
 {k:"a_elektrik_status",n:"3",t:"Status Bekalan Elektrik Sediada/Semasa",opts:["Kerap terputus","Litar pintas (trip)","Tiada masalah"],multi:1,x:"Tiada masalah"},
 {k:"a_pili",n:"4",t:"Bilangan Fire Hydrant (Pili Bomba)",nums:[{f:"bil",l:"Bilangan pili bomba"}]},
 {k:"a_kebakaran",n:"5",t:"Status Sistem Pencegah Kebakaran",opts:["Sprinkler","Pili bomba","Pemadam api"],multi:1},
 {k:"a_tanah",n:"6",t:"Status Pemilikan Tanah",opts:["PTP","Pajakan","PTG Negeri","Sementara","Tanah wakaf"]},
 {k:"a_elektrik_jenis",n:"7",t:"Jenis Bekalan Elektrik Sediada",opts:["Pencawang TNB","Compact Sub Station TNB","Bilik suis"],multi:1},
 {k:"a_bulk",n:"8",t:"Jenis Sistem Bekalan Air Utama – Bulk Meter",opts:AT},
 {k:"a_meter",n:"9",t:"Bilangan meter air yang terdapat dalam kawasan sekolah",nums:[{f:"bil",l:"Bilangan meter air"}]},

/* IndexedDB: barisan gambar yang belum dimuat naik (selamat jika talian terputus) */
const qdb=(()=>{let p,mem=new Map();
  const open=()=>p||(p=new Promise((res,rej)=>{try{const r=indexedDB.open("llt",1);r.onupgradeneeded=()=>r.result.createObjectStore("q",{keyPath:"qid"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}));
  const run=(mode,fn)=>open().then(db=>new Promise((res,rej)=>{const t=db.transaction("q",mode);const rq=fn(t.objectStore("q"));t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error)}));
  return{
    put:v=>run("readwrite",s=>s.put(v)).catch(()=>{mem.set(v.qid,v)}),
    del:k=>run("readwrite",s=>s.delete(k)).catch(()=>{mem.delete(k)}),
    all:()=>run("readonly",s=>s.getAll()).then(a=>[...(a||[]),...mem.values()]).catch(()=>[...mem.values()])};
})();

async function api(action,data={}){
  if(!API_URL){const e=new Error("API_URL belum ditetapkan dalam index.html.");e.config=true;throw e}
  let res;
  try{res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,token:auth&&auth.token,nama:auth&&auth.nama,...data}),redirect:"follow"})}
  catch(e){const x=new Error("Tiada talian internet.");x.net=true;throw x}
  let j; try{j=await res.json()}catch(e){const x=new Error("Pelayan tidak memberi respons yang sah.");x.net=true;throw x}
  if(!j.ok){const x=new Error(j.error||"Ralat pelayan.");x.server=true;if(j.error==="SESI_TAMAT"){x.session=true;sessionEnded()}throw x}
  return j;
}

function persistOutbox(){store.set("llt.outbox",outbox)}
function persistCache(){store.set("llt.cache",cache)}
function report(rid){const base=clone(cache.reports[rid]||null);const p=outbox[rid];if(!base&&!p)return null;return merge(base||{pid:rid,tarikh:"",pegawai:"",lain:"",status:"draf",items:{}},clone(p||{}))}
function item(r,k){return(r&&r.items&&r.items[k])||{}}
function photoList(rid){return[...(photos[rid]||[]),...queue.filter(q=>q.pid===rid).map(q=>({id:q.qid,k:q.k,thumb:q.thumb,t:q.t,queued:true,busy:q.busy}))]}
function photoCount(rid,k){if(photos[rid])return photoList(rid).filter(p=>p.k===k).length;return((cache.photoCounts[rid]||{})[k]||0)+queue.filter(q=>q.pid===rid&&q.k===k).length}
function filled(rid,r,k){const it=item(r,k);return!!(it.s||(it.m&&it.m.length)||(it.v&&Object.values(it.v).some(x=>String(x).trim()))||(it.c&&it.c.trim())||photoCount(rid,k))}
function progress(rid){const r=report(rid);let n=0,a=0;const its=itemsOf(rid);its.forEach(d=>{if(filled(rid,r,d.k))n++;if(item(r,d.k).s==="tindakan")a++});return{n,a,tot:its.length}}
function statusOf(rid){const r=report(rid);if(r&&r.status==="selesai")return"selesai";return(r&&r.tarikh)||progress(rid).n?"draf":"belum"}
const pendingCount=()=>Object.keys(outbox).length+queue.length;

let flushT;
function patch(rid,p,delay=900){
  const r=report(rid);
  if(!(r&&r.tarikh)&&p.tarikh===undefined){const t=$("#tarikh");if(t&&t.value)p={...p,tarikh:t.value}}
  outbox[rid]=merge(outbox[rid]||{},clone(p));persistOutbox();
  updateSync();clearTimeout(flushT);flushT=setTimeout(sync,delay);
}
async function sync(){
  if(syncing||!auth)return; syncing=true; updateSync();
  try{
    for(const rid of Object.keys(outbox)){
      const sent=outbox[rid]; delete outbox[rid]; persistOutbox();
      try{const j=await api("savePatch",{pid:rid,patch:sent});cache.reports[rid]=j.report;persistCache();lastErr=""}
      catch(e){outbox[rid]=merge(clone(sent),outbox[rid]||{});persistOutbox();if(e.net){online=false;break}if(e.session)break;lastErr=e.message;break}
    }
    for(const q of queue.slice()){
      if(!auth)break; q.busy=true; if(q.pid===view.rid)renderPhotos(q.k);
      try{
        const j=await api("uploadPhoto",{qid:q.qid,pid:q.pid,k:q.k,full:q.full,thumb:q.thumb,t:q.t});
        await qdb.del(q.qid); queue=queue.filter(x=>x.qid!==q.qid); fullCache.set(j.photo.id,q.full);
        if(photos[q.pid])photos[q.pid].push(j.photo);
        const pc=cache.photoCounts[q.pid]=cache.photoCounts[q.pid]||{};pc[q.k]=(pc[q.k]||0)+1;persistCache();online=true;lastErr="";
      }catch(e){q.busy=false;if(e.net){online=false;break}if(e.session)break;q.fails=(q.fails||0)+1;lastErr="Gambar gagal dihantar: "+e.message;if(q.fails>=3)break}
      if(q.pid===view.rid)renderPhotos(q.k);
    }
    if(!pendingCount())online=true;
  }finally{syncing=false;updateSync();if(view.screen==="list")renderList();else applyState(view.rid)}
}
function updateSync(){
  const el=$("#sync");if(!el)return;const n=pendingCount();
  el.className="sync"+(n?(online?" wait":" off"):"");
  const msg=syncing?"Menghantar…":n?(online?`${n} perubahan menunggu dihantar`:`Tiada talian · ${n} perubahan disimpan dalam telefon`):"Semua data disegerakkan";
  el.querySelector(".msg").textContent=lastErr&&!syncing?lastErr:msg;
  const s=$("#savestate");if(s)s.innerHTML=n?(syncing?"Menghantar…":online?"Belum dihantar":"<b>Disimpan dalam telefon</b> · dihantar bila ada talian"):"<b>Disimpan</b> ke sistem";
}

/* ======================= GAMBAR ======================= */
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
function drawTo(img,max){const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c}
async function processImage(file,label){
  const url=URL.createObjectURL(file);
  try{
    const img=await loadImg(url);
    const c=drawTo(img,1600),x=c.getContext("2d"),w=c.width,h=c.height;
    const fs=Math.max(14,Math.round(Math.min(w,h)*0.032)),pad=Math.round(fs*.6);
    x.fillStyle="rgba(0,0,0,.55)";x.fillRect(0,h-fs-pad*2,w,fs+pad*2);
    x.fillStyle="#fff";x.font=`600 ${fs}px system-ui,sans-serif`;x.textBaseline="middle";
    let txt=`${label} · ${fmtTime(file.lastModified||Date.now())}`;while(x.measureText(txt).width>w-pad*2&&txt.length>12)txt=txt.slice(0,-2);
    x.fillText(txt,pad,h-pad-fs/2);
    const full=c.toDataURL("image/jpeg",0.8);
    const stamped=await loadImg(full);let thumb=drawTo(stamped,360).toDataURL("image/jpeg",0.62);
    if(thumb.length>45000)thumb=drawTo(stamped,240).toDataURL("image/jpeg",0.5);
    return{full,thumb};
  }finally{URL.revokeObjectURL(url)}
}
async function addPhotos(rid,k,files){
  const P=proj(pidOf(rid)),d=defOf(rid,k),tag=fOf(rid)==="A"?"Borang A · ":"";
  for(const f of files){
    if(!f.type.startsWith("image/")){toast("Hanya fail gambar diterima.");continue}
    try{
      const {full,thumb}=await processImage(f,`${P.kod||P.id} · ${tag}${d.n}. ${d.t}`);
      const q={qid:uid(),pid:rid,k,full,thumb,t:Date.now()};
      await qdb.put(q);queue.push(q);if(view.rid===rid){renderPhotos(k);refreshCard(k);updateTabs()}updateSync();
    }catch(e){toast("Gambar tidak dapat diproses. Cuba ambil semula.")}
  }
  sync();
}
async function getFull(p){
  if(p.queued){const q=queue.find(x=>x.qid===p.id);return q&&q.full}
  if(fullCache.has(p.id))return fullCache.get(p.id);
  const j=await api("getPhoto",{id:p.id});
  if(fullCache.size>40)fullCache.delete(fullCache.keys().next().value);
  fullCache.set(p.id,j.data);return j.data;
}
async function deletePhoto(rid,p){
  if(p.queued){await qdb.del(p.id);queue=queue.filter(q=>q.qid!==p.id)}
  else{
    try{await api("deletePhoto",{id:p.id})}catch(e){toast(e.net?"Perlu talian internet untuk memadam gambar yang sudah dihantar.":e.message);return false}
    photos[rid]=(photos[rid]||[]).filter(x=>x.id!==p.id);fullCache.delete(p.id);
    const pc=cache.photoCounts[rid];if(pc&&pc[p.k])pc[p.k]--;persistCache();
  }
  renderPhotos(p.k);refreshCard(p.k);updateTabs();updateSync();return true;
}

function answerA(d,it){
  const parts=[];
  if(d.opts&&!d.multi&&it.s)parts.push(it.s.toUpperCase());
  if(d.multi&&it.m&&it.m.length)parts.push(it.m.join(", "));
  if(d.sub&&it.m&&it.m.length)parts.push((d.opts?d.subLabel+": ":(d.subLabel||"")+": ")+it.m.join(", "));
  if(d.nums){const v=it.v||{};const ns=d.nums.filter(n=>String(v[n.f]||"").trim()).map(n=>d.nums.length>1||d.opts?`${n.l}: ${v[n.f]}`:String(v[n.f]));if(ns.length)parts.push(ns.join(", "))}
  if(it.c&&it.c.trim())parts.push(it.c.trim());
  return parts.join(". ");
}
const questionA=d=>d.t+(d.opts?` (${d.opts.join(" / ").toUpperCase()})`:"")+(d.h?` - ${d.h}`:"")+(d.nota?`\nNota: ${d.nota}`:"");

/* ======================= PDF ======================= */
const clean=s=>String(s||"").replace(/[–—]/g,"-").replace(/…/g,"...").replace(/[‘’]/g,"'").replace(/✓/g,"");
function pdfKit(doc){
  const W=210,M=15,CW=W-2*M,BOT=282;const st={y:M};
  const page=need=>{if(st.y+need>BOT){doc.addPage();st.y=M;return true}return false};
  return{W,M,CW,BOT,st,page};
}
async function addPhotoAppendix(doc,K,rid,items,btn,skip){
  const all=photoList(rid).filter(p=>!skip||p.k!==skip);if(!all.length)return;
  const r=report(rid)||{};
  doc.addPage();K.st.y=K.M;doc.setFont("helvetica","bold");doc.setFontSize(12);doc.text("LAMPIRAN GAMBAR",K.M,K.st.y+5);K.st.y+=11;doc.setFontSize(10);
  const gw=(K.CW-6)/2;let done=0;
  for(const d of items){const ps=all.filter(x=>x.k===d.k);if(!ps.length)continue;
    K.page(14);doc.setFont("helvetica","bold");doc.text(doc.splitTextToSize(clean(`${d.n}. ${d.other&&r.lain?"Lain-lain: "+r.lain:d.t}`),K.CW),K.M,K.st.y+4);K.st.y+=7;
    for(let i=0;i<ps.length;i+=2){
      const imgs=[];
      for(const ph of ps.slice(i,i+2)){btn.textContent=`Gambar ${++done}/${all.length}`;let src;try{src=await getFull(ph)}catch(e){src=ph.thumb}if(!src)src=ph.thumb;const im=await loadImg(src);imgs.push({src,w:im.naturalWidth,h:im.naturalHeight})}
      const h=Math.max(...imgs.map(m=>gw*m.h/m.w));K.page(h+4);imgs.forEach((m,j)=>doc.addImage(m.src,"JPEG",K.M+j*(gw+6),K.st.y,gw,gw*m.h/m.w));K.st.y+=h+4}
    K.st.y+=3}
}
function footer(doc,K,P,label){const n=doc.getNumberOfPages();doc.setFontSize(8);doc.setFont("helvetica","normal");
  for(let i=1;i<=n;i++){doc.setPage(i);doc.text(clean(`${label} - ${P.kod||P.id} - ${P.sekolah}`),K.M,292);doc.text(`Muka ${i}/${n}`,K.W-K.M,292,{align:"right"})}}

async function makePDF(rid,btn){
  if(!window.jspdf)return toast("Modul PDF belum dimuatkan. Pastikan ada talian dan cuba lagi.");
  btn.disabled=true;const old=btn.innerHTML;btn.textContent="Menjana…";
  try{
    const{jsPDF}=window.jspdf,doc=new jsPDF({unit:"mm",format:"a4"}),K=pdfKit(doc),P=proj(pidOf(rid)),f=fOf(rid);
    if(f==="A")await pdfBorangA(doc,K,rid,P,btn);else await pdfLawatan(doc,K,rid,P,btn);
    footer(doc,K,P,f==="A"?"Borang A RMKe13":"Laporan Lawatan Tapak");
    const name=`${f==="A"?"Borang_A_RMKe13":"Laporan_Lawatan_Tapak"}_${P.kod||P.id}.pdf`;
    openPdfSheet(doc.output("blob"),name);
  }catch(e){toast("PDF tidak dapat dijana: "+(e.message||"ralat"))}
  btn.disabled=false;btn.innerHTML=old;
}
async function pdfLawatan(doc,K,rid,P,btn){
  const r=report(rid)||{},{M,CW,W}=K;
  doc.setFont("helvetica","bold");doc.setFontSize(14);doc.text("LAPORAN LAWATAN TAPAK PROJEK",W/2,K.st.y+5,{align:"center"});K.st.y+=12;doc.setFontSize(10);
  for(const[l,v]of[["NAMA PROJEK",P.nama],["KOD SEKOLAH",P.kod||"-"],["NAMA SEKOLAH",P.sekolah],["PPD",P.ppd||"-"],["TARIKH LAWATAN",fmtDate(r.tarikh)],["PEGAWAI",r.pegawai||"-"]]){
    doc.setFont("helvetica","normal");const lines=doc.splitTextToSize(clean(v),CW-42),h=Math.max(8,lines.length*4.6+3.4);K.page(h);
    doc.rect(M,K.st.y,40,h);doc.rect(M+40,K.st.y,CW-40,h);doc.setFont("helvetica","bold");doc.text(l,M+2,K.st.y+5.3);doc.setFont("helvetica","normal");doc.text(lines,M+42,K.st.y+5.3);K.st.y+=h}
  K.st.y+=6;const c1=58,c2=30,c3=CW-c1-c2;
  const head=()=>{K.page(9);doc.setFillColor(225,225,225);doc.rect(M,K.st.y,CW,8,"FD");doc.setFont("helvetica","bold");doc.text("Perkara",M+2,K.st.y+5.4);doc.text("Status",M+c1+2,K.st.y+5.4);doc.text("Catatan",M+c1+c2+2,K.st.y+5.4);K.st.y+=8};
  head();
  const row=(nm,stt,cat,bold)=>{doc.setFont("helvetica",bold?"bold":"normal");const a=doc.splitTextToSize(clean(nm),c1-4);doc.setFont("helvetica","normal");const b=doc.splitTextToSize(clean(stt),c2-4),c=doc.splitTextToSize(clean(cat),c3-4);
    const h=Math.max(a.length,b.length,c.length)*4.6+3.4;if(K.page(h))head();
    doc.rect(M,K.st.y,c1,h);doc.rect(M+c1,K.st.y,c2,h);doc.rect(M+c1+c2,K.st.y,c3,h);doc.setFont("helvetica",bold?"bold":"normal");doc.text(a,M+2,K.st.y+5.3);doc.setFont("helvetica","normal");doc.text(b,M+c1+2,K.st.y+5.3);doc.text(c,M+c1+c2+2,K.st.y+5.3);K.st.y+=h};
  PERKARA.forEach(p=>{if(p.n==="10a")row("10. Penyuraian","","",true);const it=item(r,p.k),n=photoCount(rid,p.k);
    const nm=(p.g?"   - ":p.n+". ")+(p.other?"Lain-lain"+(r.lain?": "+r.lain:""):p.t+(p.h?` (${p.h})`:""));
    row(nm,it.s?STATUS[it.s]:"-",(it.c&&it.c.trim()?it.c.trim():"-")+(n?`\n[${n} gambar - rujuk lampiran]`:""))});
  await addPhotoAppendix(doc,K,rid,PERKARA,btn);
}
async function pdfBorangA(doc,K,rid,P,btn){
  const r=report(rid)||{},{M,CW,W}=K;let y=M;
  doc.setFont("helvetica","bold");doc.setFontSize(10.5);doc.text("BORANG A - RMKe13 RP1 / BPN3",W-M,y+4,{align:"right"});
  // Kotak cop sekolah
  const bw=52,bh=30,bx=W-M-bw,by=y+7;doc.setLineWidth(0.6);doc.rect(bx,by,bw,bh);doc.setLineWidth(0.2);
  const cop=photoList(rid).find(p=>p.k==="a_cop");
  if(cop){try{let src=await getFull(cop).catch(()=>cop.thumb);src=src||cop.thumb;const im=await loadImg(src);const sc=Math.min((bw-4)/im.naturalWidth,(bh-8)/im.naturalHeight);const iw=im.naturalWidth*sc,ih=im.naturalHeight*sc;doc.addImage(src,"JPEG",bx+(bw-iw)/2,by+2,iw,ih)}catch(e){}}
  doc.setFont("helvetica","normal");doc.setFontSize(8);doc.text("COP SEKOLAH",bx+bw-2,by+bh-2,{align:"right"});
  doc.setFontSize(10.5);doc.setFont("helvetica","bold");doc.text("MAKLUMAT AM SEKOLAH",M+8,y+12);
  const lw=CW-bw-14;
  doc.text("Nama Sekolah :",M+8,y+20);doc.setFont("helvetica","normal");const sl=doc.splitTextToSize(clean(P.sekolah+(P.kod?` (${P.kod})`:"")),lw-30);doc.text(sl,M+38,y+20);
  let yy=y+20+sl.length*4.6+2.4;doc.setFont("helvetica","bold");doc.text("Tarikh :",M+8,yy);doc.setFont("helvetica","normal");doc.text(fmtDate(r.tarikh),M+38,yy);
  if(r.pegawai){yy+=7;doc.setFont("helvetica","bold");doc.text("Pegawai :",M+8,yy);doc.setFont("helvetica","normal");const pl=doc.splitTextToSize(clean(r.pegawai),lw-30);doc.text(pl,M+38,yy);yy+=(pl.length-1)*4.6}
  K.st.y=Math.max(yy+6,by+bh+5);
  doc.setFontSize(9.5);const c1=11,c2=86,c3=CW-c1-c2;
  const head=()=>{K.page(8);doc.setFillColor(225,225,225);doc.rect(M,K.st.y,CW,7,"FD");doc.setFont("helvetica","bold");doc.text("Bil.",M+c1/2,K.st.y+4.8,{align:"center"});doc.text("Soalan",M+c1+c2/2,K.st.y+4.8,{align:"center"});doc.text("Catatan",M+c1+c2+c3/2,K.st.y+4.8,{align:"center"});K.st.y+=7};
  head();
  SOALAN.filter(d=>!d.hdr).forEach(d=>{
    const it=item(r,d.k),n=photoCount(rid,d.k);
    const qa=doc.splitTextToSize(clean(questionA(d)),c2-4);
    const ans=(answerA(d,it)||"")+(n?`${answerA(d,it)?"\n":""}[${n} gambar - rujuk lampiran]`:"");
    const ca=doc.splitTextToSize(clean(ans),c3-4);
    const h=Math.max(qa.length,ca.length,1)*4.3+4.2;if(K.page(h))head();
    const yT=K.st.y;doc.rect(M,yT,c1,h);doc.rect(M+c1,yT,c2,h);doc.rect(M+c1+c2,yT,c3,h);
    doc.setFont("helvetica","normal");doc.text(d.n,M+c1/2,yT+5,{align:"center"});doc.text(qa,M+c1+2,yT+5);
    doc.setFont("helvetica","bold");doc.text(ca,M+c1+c2+2,yT+5);K.st.y+=h});
  doc.setFontSize(10);
  await addPhotoAppendix(doc,K,rid,SOALAN,btn,"a_cop");
}
function openPdfSheet(blob,name){
  const url=URL.createObjectURL(blob),file=new File([blob],name,{type:"application/pdf"});
  const canShare=navigator.canShare&&navigator.canShare({files:[file]});const L=$("#layer");
  L.innerHTML=`<div class="modal"><div class="sheet"><h3>PDF sedia</h3><p style="margin:0" class="mono">${esc(name)} · ${(blob.size/1048576).toFixed(1)} MB</p>
    <div class="row"><button class="btn" id="px">Tutup</button>${canShare?`<button class="btn" id="ps">Kongsi</button>`:""}<a class="btn primary" href="${url}" download="${esc(name)}">${ICON.pdf}Muat turun</a></div></div></div>`;
  $("#px").onclick=()=>{L.innerHTML="";URL.revokeObjectURL(url)};
  const s=$("#ps");if(s)s.onclick=()=>navigator.share({files:[file],title:name}).catch(()=>{});
}

/* ======================= TAMBAH PROJEK ======================= */
function openAddProject(){
  const L=$("#layer");
  L.innerHTML=`<div class="modal"><form class="sheet" id="fp"><h3>Tambah projek</h3>
    <div class="field"><label for="np-kod">Kod sekolah</label><input id="np-kod" class="mono" placeholder="Contoh: KBA1234"></div>
    <div class="field"><label for="np-sek">Nama sekolah / lokasi</label><input id="np-sek" required></div>
    <div class="field"><label for="np-ppd">PPD</label><select id="np-ppd">${PPD_KEDAH.map(p=>`<option>${p}</option>`).join("")}</select></div>
    <div class="field"><label for="np-nama">Nama projek</label><textarea id="np-nama" required></textarea></div>
    <div class="row"><button type="button" class="btn" id="np-x">Batal</button><button class="btn primary" id="np-ok">Simpan projek</button></div></form></div>`;
  $("#np-x").onclick=()=>L.innerHTML="";
  $("#fp").onsubmit=async e=>{e.preventDefault();const b=$("#np-ok");b.disabled=true;
    try{const j=await api("addProject",{project:{kod:$("#np-kod").value,sekolah:$("#np-sek").value,ppd:$("#np-ppd").value,nama:$("#np-nama").value}});
      cache.projects.push(j.project);persistCache();L.innerHTML="";renderList();toast("Projek ditambah.")}
    catch(err){b.disabled=false;toast(err.net?"Perlu talian untuk menambah projek.":err.message)}};
}

/* ======================= LALUAN ======================= */
function parseHash(){const h=decodeURIComponent(location.hash.slice(1));if(!h)return null;const[id,f]=h.split("/");return{id,f:f==="A"?"A":"L"}}
function route(){
  if(!auth){renderLogin();return}
  const h=parseHash();
  $("#layer").innerHTML="";
  if(h&&proj(h.id)){const rid=ridOf(h.id,h.f);view={screen:"form",rid};filt.f=h.f;store.set("llt.f",h.f);renderForm(rid);window.scrollTo(0,0)}
  else{view={screen:"list",rid:null};renderList()}
}
function rerender(){const h=parseHash();if(view.screen==="form"&&proj(pidOf(view.rid)))applyState(view.rid);else if(h&&proj(h.id))route();else{view={screen:"list",rid:null};renderList()}}
window.addEventListener("hashchange",()=>{clearTimeout(flushT);if(pendingCount())sync();route()});

async function startApp(){
  queue=(await qdb.all()).sort((a,b)=>a.t-b.t);
  route();
  await sync();
  await loadAll();
}
(function boot(){
  if(auth&&auth.exp<Date.now()){auth=null;store.del("llt.auth")}
  if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
  if(auth)startApp();else renderLogin();
})();
</script>
